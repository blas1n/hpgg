name: collect-and-deploy

on:
  schedule:
    # Fallback only. The daily run is dispatched from the Mac mini at 03:20 KST (tools/collect/, launchd), because
    # GitHub started this cron ~4 h late every night (18:20Z asked, 22:15–22:41Z run, 2026-09-29 → 10-01) and the
    # site says "매일 새벽 갱신". 05:20 KST here; the gate below skips it when the dawn run already collected.
    # GitHub registers a schedule from the default branch's workflow file; if `gh run list --event schedule` is
    # ever empty after a rename, dispatch once by hand.
    - cron: "20 20 * * *"
  workflow_dispatch:
    inputs:
      if_stale:
        description: "Skip collecting when data/latest was collected in the last 12 h (the Mac mini's dawn dispatch sets this)"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

permissions: {}
# Nothing by default; each job asks for what it needs. Actions are pinned to a commit (a tag can be moved).

jobs:
  gate:
    # the cron fallback and the Mac mini's dispatch: whichever comes second finds today's data and stops here, so
    # the week's Heroes/Stats quota (210) is never spent twice in a night. A plain manual dispatch always collects.
    if: github.event_name == 'schedule' || inputs.if_stale
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fresh: ${{ steps.check.outputs.fresh }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            collector
            data/latest/meta.json
          sparse-checkout-cone-mode: false
      - id: check
        run: python3 -m collector.freshness data/latest/meta.json 12 | tee -a "$GITHUB_OUTPUT"

  collect:
    needs: [gate]
    # cron / manual only — a push just rebuilds and deploys what is already in data/; the gate is skipped on a
    # plain manual dispatch, hence always()
    if: always() && github.event_name != 'push' && needs.gate.outputs.fresh != 'true'
    runs-on: ubuntu-latest
    # stats ~25 min (24 calls at 1 a minute) + builds + matchups (≤ 25 min budget, + at most one
    # in-flight job poll of ≤ 15 min)
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    outputs:
      day: ${{ steps.run.outputs.day }}
    steps:
      # no deploy key here: this job runs third-party code (setup-uv, PyPI packages); the push is the `publish` job's
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen --no-dev
      - name: Collect (QM, SL, 브실골플, 다마그 × KR/NA/EU + solo twins = 24 stats calls, ~25 min at 1 req/min; 1 builds call; then Storm League matchups for heroes due, every other day)
        id: run
        env:
          HP_API_TOKEN: ${{ secrets.HP_API_TOKEN }}
        run: |
          uv run python -m collector
          # the folder the collector just wrote (its day is KST: collector.run.snapshot_day)
          echo "day=$(ls data/.snapshot_out | sort | tail -1)" >> "$GITHUB_OUTPUT"
      # before the push, and whatever happens: 2026-10-02 the push was refused and the run's
      # data went with the runner (the week's quota could not pay for it again)
      - name: Keep the collected data as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collected-data
          path: |
            data/latest
            data/previous
            data/matchups
            data/history
            data/weekly
            data/patchnotes.json
            data/.snapshot_out
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: Open an issue when the collector fails
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `collector failed ${new Date().toISOString().slice(0,10)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["collector"],
            });

  publish:
    needs: [collect]
    # The one job holding DATA_DEPLOY_KEY (main takes no direct push, ruleset `main` 2026-10-01; deploy keys are its
    # bypass, and a push to main is deployed on the Mac mini). Only GitHub's own actions and git run here — no
    # package installs, nothing third-party — so nothing else ever sees the key.
    if: needs.collect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      # the collect job's data/ exactly: a file the collector removed is removed here too
      - run: rm -rf data/latest data/previous data/matchups data/history data/weekly data/patchnotes.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collected-data
          path: data
      - name: Commit data/latest (+ previous, matchups, history, weekly, patch notes) to main
        run: |
          git config user.name "hotsmeta-bot"
          git config user.email "bot@hpgg.win"
          git add data/latest
          if [ -d data/previous ]; then git add data/previous; fi
          if [ -d data/matchups ]; then git add data/matchups; fi
          # 주간 메타 리포트: the day's record and any issue it closed (collector/weekly.py)
          if [ -d data/history ]; then git add data/history; fi
          if [ -d data/weekly ]; then git add data/weekly; fi
          if [ -f data/patchnotes.json ]; then git add data/patchnotes.json; fi
          git commit -m "data: $(TZ=Asia/Seoul date +%F) $(python3 -c 'import json;print(json.load(open("data/latest/meta.json"))["current_patch"])')" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push origin main
      - name: Archive raw + normalised snapshots to the orphan `snapshots` branch
        run: |
          set -e
          DAY="${{ needs.collect.outputs.day }}"
          git fetch origin snapshots:snapshots || { echo "create the orphan branch once: git checkout --orphan snapshots && git commit --allow-empty -m init && git push origin snapshots"; exit 1; }
          git worktree add ../snap snapshots
          mkdir -p "../snap/snapshots/$DAY"
          cp -r "data/.snapshot_out/$DAY/." "../snap/snapshots/$DAY/"
          cd ../snap && git add snapshots && git commit -m "snapshot $DAY" && git push origin snapshots
      - name: Open an issue when the push fails (the data is in the run's collected-data artifact)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label collector \
            --title "collector push failed $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID - the data is in its collected-data artifact; commit it through a PR."

  build:
    needs: [collect, publish]
    # after a successful collect and publish, or when nothing was collected (push to main, or a fresh gate).
    # npm packages run here, so this job can publish nothing: it only hands the site to `deploy`.
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build web
        run: cd web && npm ci && npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: [build]
    # GitHub's deploy action only: the one step with the right to publish the site. always(): build's own needs are
    # skipped on a push or a fresh gate, and GitHub skips a job after a skipped one unless told otherwise
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
