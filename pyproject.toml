[project]
name = "hpgg-collector"
version = "0.1.0"
description = "hotsmeta.gg — Heroes Profile API v1 daily hero-stats collector"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=23.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's async engine runs sync code (event listeners) inside greenlets
concurrency = ["greenlet", "thread"]
omit = ["server/migrations/env.py"]
